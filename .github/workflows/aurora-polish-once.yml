name: One-off Aurora design verification

on:
  push:
    branches:
      - design/professional-home-no-docs

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean install
        run: npm ci
      - name: Format changed files
        run: npx prettier --write src/pages/index.astro src/pages/about.astro src/components/portfolio/WorkArchive.astro src/components/portfolio/ProjectCard.astro astro.config.mjs src/site.config.ts src/content.config.ts src/components/common/Footer.astro .github/workflows/ci.yml .github/workflows/deploy.yml package.json
      - name: Commit clean formatting and lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src/pages/index.astro src/pages/about.astro src/components/portfolio/WorkArchive.astro src/components/portfolio/ProjectCard.astro astro.config.mjs src/site.config.ts src/content.config.ts src/components/common/Footer.astro .github/workflows/ci.yml .github/workflows/deploy.yml package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: format Aurora website and sync dependencies"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
