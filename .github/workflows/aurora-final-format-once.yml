name: One-off Aurora formatting and build

on:
  push:
    branches:
      - fix/starlight-dependency-lock

permissions:
  contents: write

jobs:
  format-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format changed Astro files
        run: npx prettier --write src/pages/index.astro src/components/ui/Picture.astro
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/index.astro src/components/ui/Picture.astro
          if ! git diff --cached --quiet; then
            git commit -m "style: format final Astro fixes"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
