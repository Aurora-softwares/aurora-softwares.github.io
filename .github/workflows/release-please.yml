name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          release-type: node
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
