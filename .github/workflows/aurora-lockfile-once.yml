name: One-off Starlight lockfile repair

on:
  push:
    branches:
      - fix/starlight-dependency-lock

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: regenerate npm lockfile after Astro dependency updates"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Verify clean install
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
